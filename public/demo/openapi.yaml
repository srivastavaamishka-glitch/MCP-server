openapi: 3.0.3
info:
  title: Task Manager API
  description: A sample REST API for managing todo tasks, optimized for MCP server generation testing.
  version: 1.0.0
servers:
  - url: https://api.example.com/v1
    description: Production server
paths:
  /tasks:
    get:
      summary: List tasks
      description: Retrieve a paginated list of tasks with optional filtering by status.
      operationId: listTasks
      parameters:
        - name: status
          in: query
          description: Filter tasks by completion status (completed, pending)
          required: false
          schema:
            type: string
            enum: [completed, pending]
        - name: limit
          in: query
          description: Maximum number of tasks to return
          required: false
          schema:
            type: integer
            default: 10
      responses:
        '200':
          description: A list of tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Task'

    post:
      summary: Create task
      description: Add a new task to the collection.
      operationId: createTask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Task created successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'

  /tasks/{id}:
    get:
      summary: Get task details
      description: Fetch a specific task by its unique numeric ID.
      operationId: getTaskById
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the task
          schema:
            type: integer
      responses:
        '200':
          description: Task details retrieved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '404':
          description: Task not found

    delete:
      summary: Delete task
      description: Remove a task permanently by its unique numeric ID.
      operationId: deleteTask
      parameters:
        - name: id
          in: path
          required: true
          description: Unique identifier of the task to delete
          schema:
            type: integer
      responses:
        '204':
          description: Task deleted successfully
        '404':
          description: Task not found

components:
  schemas:
    Task:
      type: object
      required:
        - id
        - title
        - completed
      properties:
        id:
          type: integer
          example: 101
        title:
          type: string
          example: "Build Anything-to-MCP Hackathon Project"
        description:
          type: string
          example: "Parse OpenAPI spec and host dynamic MCP server."
        completed:
          type: boolean
          example: false

    TaskInput:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          example: "Submit hackathon project link"
        description:
          type: string
          example: "Ensure deployment link and GitHub repo are attached."
